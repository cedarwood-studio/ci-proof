name: Docker

on:
  push:
    branches: ["**"]
    paths:
      - "node-service/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "node-service/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, healthcheck, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: node-service
          tags: ci-proof-node-service:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name ci-proof-node-service -p 3000:3000 ci-proof-node-service:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' ci-proof-node-service || true)"
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy." >&2
          docker logs ci-proof-node-service || true
          exit 1

      - name: Hit the health endpoint directly
        run: curl --fail --silent --show-error http://localhost:3000/health

      - name: Stop container
        if: always()
        run: docker rm -f ci-proof-node-service || true

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-proof-node-service:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
